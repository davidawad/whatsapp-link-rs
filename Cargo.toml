[package]
name = "whatsapp-link"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Link a WhatsApp account and read/send messages from Rust by driving wuzapi over stdio JSON-RPC"
readme = "README.md"
repository = "https://github.com/davidawad/whatsapp-link-rs"
homepage = "https://github.com/davidawad/whatsapp-link-rs"
documentation = "https://docs.rs/whatsapp-link"
authors = ["David Awad"]
keywords = ["whatsapp", "wuzapi", "json-rpc", "messaging"]
categories = ["api-bindings", "command-line-utilities"]
license = "GPL-3.0-only"
exclude = ["BRIEF.md", ".beads/", "target/", ".github/", "devenv.*", ".pre-commit-config.yaml", "renovate.json", "release-please-config.json", ".release-please-manifest.json"]

[lib]
name = "whatsapp_link"
path = "src/lib.rs"

[[bin]]
name = "whatsapp-link"
path = "src/main.rs"

[features]
default = []
# Placeholder only: a future pure-Rust backend (for example the `whatsapp-rust`
# crate, https://github.com/oxidezap/whatsapp-rust, MIT) that would replace the
# wuzapi child process. Enabling it currently changes nothing.
native = []

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
png = "0.17"
qrcode = { version = "0.14", default-features = false }
rqrr = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting", "serde-well-known"] }

[dev-dependencies]
tempfile = "3"

[workspace]

[lints.clippy]
too_many_lines = "warn"
too_many_arguments = "warn"
type_complexity = "warn"
